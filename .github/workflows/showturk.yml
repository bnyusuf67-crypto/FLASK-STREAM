name: shturk

on:
  schedule:
    - cron: '*/30 * * * *' # Gecikmelerden ötürü 30 dakikaya azaltıldı.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Python script
        run: |
          mkdir -p streams
          python3 showturk.py

      - name: commit & push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "updated streams $(date +'%Y-%m-%d %H:%M:%S')" || echo "No updated streams"
          git push
